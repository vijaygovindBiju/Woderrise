[workspace]
members = [
    "crates/woderrise-core",
    "crates/woderrise-cli",
    "crates/woderrise-dbus",
    "crates/woderrise-gui",
    "crates/woderrise-privhelper",
    "crates/woderrise-desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[patch.crates-io]
annotate-snippets = { path = "crates/woderrise-desktop/vendor/annotate-snippets" }
