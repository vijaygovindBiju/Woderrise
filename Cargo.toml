[workspace]
members = [
    "crates/woderrise-core",
    "crates/woderrise-github",
    "crates/woderrise-detect",
    "crates/woderrise-transaction",
    "crates/woderrise-gui",
]
default-members = ["crates/woderrise-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["vijaygovindBiju <vijaygovindbiju@gmail.com>"]
repository = "https://github.com/vijaygovindBiju/Woderrise"
rust-version = "1.88"

[workspace.dependencies]
# Internal workspace crates
woderrise-core = { path = "crates/woderrise-core" }
woderrise-github = { path = "crates/woderrise-github" }
woderrise-detect = { path = "crates/woderrise-detect" }
woderrise-transaction = { path = "crates/woderrise-transaction" }
woderrise-gui = { path = "crates/woderrise-gui" }

# Serialization & Deserialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
json5 = "1.3.4"

# Error Handling
thiserror = "2.0.21"

# Paths & Filesystem
camino = { version = "1.2.6", features = ["serde1"] }
directories = "6.0.0"
tempfile = "3.17.1"
walkdir = "2.5.0"
fs2 = "0.4.3"

# Networking & Async Runtime
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
moka = { version = "0.12.16", features = ["future"] }
async-trait = "0.1.92"

# Security & Cryptography
sha2 = "0.10.8"
uuid = { version = "1.16", features = ["v4", "serde"] }

# Utilities & Types
chrono = { version = "0.4.45", features = ["serde"] }
semver = { version = "1.0.28", features = ["serde"] }
regex = "1.13.1"
url = "2.5.4"

# Logging & Diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# GUI & Desktop Integration (Iced v0.14+ with Tokio executor & Wayland)
iced = { version = "0.14.0", default-features = false, features = [
    "tokio",
    "wgpu",
    "tiny-skia",
    "markdown",
    "image",
    "svg",
    "highlighter",
    "linux-theme-detection",
    "wayland",
    "x11",
] }
ashpd = { version = "0.13.13" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

# Testing & Mocking
wiremock = "0.6.5"
