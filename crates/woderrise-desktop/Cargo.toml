[package]
name = "woderrise-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "woderrise_desktop"
path = "src/lib.rs"

[[bin]]
name = "woderrise-desktop"
path = "src/main.rs"

[dependencies]
woderrise-core = { path = "../woderrise-core" }
slint = "1.18.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[build-dependencies]
slint-build = "1.18.1"
