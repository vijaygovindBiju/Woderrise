[package]
name = "woderrise-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "woderrise_cli"
path = "src/lib.rs"

[[bin]]
name = "woderrise"
path = "src/main.rs"

[dependencies]
woderrise-core = { path = "../woderrise-core" }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
